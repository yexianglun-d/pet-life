spring:
  application:
    name: petlife-server
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${PETLIFE_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/pet_life?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai}
    username: ${PETLIFE_DATASOURCE_USERNAME:petlife}
    password: ${PETLIFE_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
# 暂不配置redis
#  data:
#    redis:
#      host: ${PETLIFE_REDIS_HOST:127.0.0.1}
#      port: ${PETLIFE_REDIS_PORT:6379}
#      password: ${PETLIFE_REDIS_PASSWORD:}

server:
  port: ${PETLIFE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.petlife.server: INFO

mybatis:
  configuration:
    map-underscore-to-camel-case: true
