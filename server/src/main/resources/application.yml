spring:
  application:
    name: petlife-server
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${PETLIFE_DATASOURCE_URL}
    username: ${PETLIFE_DATASOURCE_USERNAME}
    password: ${PETLIFE_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: ${PETLIFE_MEDIA_MAX_FILE_SIZE:20MB}
      max-request-size: ${PETLIFE_MEDIA_MAX_REQUEST_SIZE:25MB}
# 当前阶段未正式接入 Redis，配置保持可选态，避免测试或本地启动因缺少环境变量直接失败。
  data:
    redis:
      host: ${PETLIFE_REDIS_HOST:localhost}
      port: ${PETLIFE_REDIS_PORT:6379}
      password: ${PETLIFE_REDIS_PASSWORD:}

server:
  port: ${PETLIFE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: ${PETLIFE_REDIS_HEALTH_ENABLED:false}

logging:
  level:
    root: INFO
    com.petlife.server: INFO

mybatis:
  configuration:
    map-underscore-to-camel-case: true

petlife:
  media:
    storage:
      provider: ${PETLIFE_MEDIA_STORAGE_PROVIDER:local}
      root-path: ${PETLIFE_MEDIA_ROOT_PATH:/tmp/petlife-media}
      bucket-name: ${PETLIFE_MEDIA_BUCKET_NAME:petlife-local}
      public-base-url: ${PETLIFE_MEDIA_PUBLIC_BASE_URL:}
      endpoint: ${PETLIFE_MEDIA_STORAGE_ENDPOINT:}
      region: ${PETLIFE_MEDIA_STORAGE_REGION:}
      max-file-size-bytes: ${PETLIFE_MEDIA_MAX_FILE_SIZE_BYTES:20971520}
