          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: 日常内容
                tags:
                  type: array
                  items:
                    type: string
                  description: 标签
                media_asset_ids:
                  type: array
                  items:
                    type: string
                  description: 媒体资源 ID 列表，必须引用当前用户已上传完成且 biz_type=daily_log 的图片或视频
                visibility:
                  type: string
                  enum: [private, family, public]
                  description: 可见范围
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DailyLog'
          
    delete:
      tags:
        - 日常 (Daily Log)
      summary: 删除萌宠日常
      description: 删除日常记录
      parameters:
        - name: petId
