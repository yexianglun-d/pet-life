openapi: 3.0.3
info:
  title: PetLife 宠物生活管家 API
  description: |
    # PetLife 宠物生活管家完整 API 文档
    
    ## 项目概述
    - **项目代号**: petlife
    - **产品名称**: 宠物生活管家
    - **交付范围**: mobile-app + server + admin-web
    
    ## 技术规范
    
    ### 鉴权约定
    - Header: `Authorization: Bearer <access_token>`
    - refresh token 通过专用接口换取
    
    ### 字段命名
    - 统一使用 `snake_case`
    
    ### 时间格式
    - ISO 8601 (UTC)
    
    ### 响应结构
    ```json
    {
      "code": "OK",
      "message": "success",
      "data": {}
    }
    ```
    
  version: 1.0.0
  contact:
    name: PetLife Team
    
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发环境
  - url: https://api-dev.petlife.com/api/v1
    description: 开发环境
  - url: https://api.petlife.com/api/v1
    description: 生产环境

tags:
  - name: 认证 (Auth)
    description: 短信登录、Token 管理
  - name: 用户 (User)
    description: 用户资料、设置管理
  - name: 后台用户 (Admin User)
    description: 用户资料、设置与归属上下文查询 (管理端)
  - name: 宠物 (Pet)
    description: 宠物档案 CRUD
  - name: 后台宠物 (Admin Pet)
    description: 宠物主档与归属关系查询 (管理端)
  - name: 家庭 (Family)
    description: 家庭共养、成员管理
  - name: 后台家庭 (Admin Family)
    description: 家庭、成员关系与家庭宠物查询 (管理端)
  - name: 健康 (Health)
    description: 健康记录管理
  - name: 媒体 (Media)
    description: 媒体资产上传与读取
  - name: 提醒 (Reminder)
    description: 提醒计划与处理
  - name: 后台提醒 (Admin Reminder)
    description: 系统提醒查询与提醒模板管理 (管理端)
  - name: 日常 (Daily Log)
    description: 萌宠日常记录
  - name: 时间轴 (Timeline)
    description: 成长时间轴聚合
  - name: 社区 (Community)
    description: 帖子、评论、互动
  - name: 服务 (Service)
    description: 医院、寄养、洗护、训练
  - name: 通知 (Notification)
    description: 站内消息中心
  - name: 首页 (Home)
    description: 周报、月报
  - name: 审核 (Moderation)
    description: 举报处理 (管理端)
  - name: 后台内容 (Admin Content)
    description: 健康记录、萌宠日常与时间轴查询 (管理端)
  - name: 后台服务 (Admin Service)
    description: 服务商、预约管理 (管理端)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 使用 access_token 进行鉴权
      
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: string
          example: "OK"
          description: 响应码
        message:
          type: string
          example: "success"
          description: 响应消息
        data:
          type: object
          description: 响应数据
          
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "PET_NOT_FOUND"
          description: 错误码
        message:
          type: string
          example: "宠物不存在"
          description: 错误消息
        request_id:
          type: string
          example: "trace_id_123"
          description: 请求追踪 ID

    MediaAsset:
      type: object
      properties:
        asset_id:
          type: string
          example: "90001"
          description: 媒体资产 ID
        biz_type:
          type: string
          enum: [avatar, health_report, daily_log, community, service_review]
          example: "daily_log"
          description: 业务类型
        media_type:
          type: string
          enum: [image, video, file]
          example: "image"
          description: 媒体类型
        file_name:
          type: string
          example: "cat.jpg"
          description: 原始文件名
        content_type:
          type: string
          example: "image/jpeg"
          description: 文件内容类型
        file_size:
          type: integer
          format: int64
          example: 12345
          description: 文件大小
        file_hash:
          type: string
          description: SHA-256 文件摘要
        upload_status:
          type: string
          example: "uploaded"
          description: 上传状态
        review_status:
          type: string
          example: "pending_review"
          description: 审核状态
        access_url:
          type: string
          example: "/api/v1/media-assets/90001/content"
          description: 文件预览地址；本地模式默认返回内容读取接口，对象存储/CDN 模式可返回外部 CDN 地址
        completed_at:
          type: string
          format: date-time
          description: 上传完成时间
        created_at:
          type: string
          format: date-time
          description: 创建时间

    Pet:
      type: object
      properties:
        pet_id:
          type: string
          example: "10001"
        pet_name:
          type: string
          example: "Momo"
        pet_type:
          type: string
          enum: [cat, dog, other]
          example: "cat"
        breed:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        adopt_date:
          type: string
          format: date
          nullable: true
        neuter_status:
          type: string
          enum: [unknown, completed, pending]
        avatar_url:
          type: string
          nullable: true
        weight_kg:
          type: string
          nullable: true
        allergy_notes:
          type: string
          nullable: true
        medical_history:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, memorial, rehomed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HealthRecord:
      type: object
      properties:
        health_record_id:
          type: string
          example: "70001"
        pet_id:
          type: string
          example: "10001"
        record_type:
          type: string
          enum: [vaccine, deworming, examination, medication, weight, observation]
        title:
          type: string
          example: "狂犬疫苗"
        value:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        hospital_name:
          type: string
          nullable: true
        doctor_name:
          type: string
          nullable: true
        severity_level:
          type: string
          nullable: true
        result_summary:
          type: string
          nullable: true
        attachment_asset_ids:
          type: array
          items:
            type: string
          description: 附件资产 ID，兼容既有客户端字段
        attachment_assets:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
          description: 附件资产元数据，用于预览
        next_reminder_id:
          type: string
          nullable: true
        next_reminder_at:
          type: string
          format: date-time
          nullable: true
        next_reminder_status:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Reminder:
      type: object
      properties:
        reminder_id:
          type: string
          example: "60001"
        pet_id:
          type: string
          example: "10001"
        reminder_type:
          type: string
          enum: [vaccine, deworming, examination, medication, custom]
          example: "deworming"
        title:
          type: string
          example: "体内驱虫提醒"
        reminder_mode:
          type: string
          enum: [single, cycle]
          example: "single"
        cycle_value:
          type: integer
          nullable: true
          example: 1
        cycle_unit:
          type: string
          nullable: true
          enum: [day, week, month]
        due_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, completed, skipped]
          description: 接口层状态；数据库 done 会统一回显为 completed
        notes:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ReminderTemplate:
      type: object
      properties:
        template_id:
          type: string
          example: "61001"
        template_name:
          type: string
          example: "年度疫苗提醒"
        reminder_type:
          type: string
          enum: [vaccine, deworming, examination, medication, custom]
          example: "vaccine"
        default_reminder_mode:
          type: string
          enum: [single, cycle]
          example: "cycle"
        default_advance_value:
          type: integer
          minimum: 0
          example: 7
          description: 默认提前量
        default_advance_unit:
          type: string
          enum: [day, week, month]
          example: "day"
          description: 默认提前单位
        default_cycle_value:
          type: integer
          nullable: true
          minimum: 1
          example: 12
          description: 周期模板的默认周期值；单次模板为 null
        default_cycle_unit:
          type: string
          nullable: true
          enum: [day, week, month]
          example: "month"
          description: 周期模板的默认周期单位；单次模板为 null
        applicable_pet_type:
          type: string
          enum: [all, cat, dog, other]
          example: "dog"
        enabled:
          type: boolean
          example: true
        sort_order:
          type: integer
          minimum: 0
          example: 10
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminUpsertReminderTemplateRequest:
      type: object
      required:
        - template_name
        - reminder_type
        - default_reminder_mode
        - default_advance_value
        - default_advance_unit
        - applicable_pet_type
        - enabled
      properties:
        template_name:
          type: string
          maxLength: 100
          example: "年度疫苗提醒"
        reminder_type:
          type: string
          enum: [vaccine, deworming, examination, medication, custom]
        default_reminder_mode:
          type: string
          enum: [single, cycle]
        default_advance_value:
          type: integer
          minimum: 0
          description: 默认提前量，允许 0 表示不提前
        default_advance_unit:
          type: string
          enum: [day, week, month]
        default_cycle_value:
          type: integer
          nullable: true
          minimum: 1
          description: default_reminder_mode=cycle 时必填；single 时不能传
        default_cycle_unit:
          type: string
          nullable: true
          enum: [day, week, month]
          description: default_reminder_mode=cycle 时必填；single 时不能传
        applicable_pet_type:
          type: string
          enum: [all, cat, dog, other]
        enabled:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          default: 0

    AdminUpdateReminderTemplateStatusRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean

    DailyLog:
      type: object
      properties:
        daily_log_id:
          type: string
          example: "80001"
        pet_id:
          type: string
          example: "10001"
        content:
          type: string
          example: "今天第一次散步，出门有点紧张，但表现很好"
        media_asset_ids:
          type: array
          items:
            type: string
          description: 媒体资产 ID，兼容既有客户端字段
        media_assets:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
          description: 媒体资产元数据，用于图片或视频预览
        tags:
          type: array
          items:
            type: string
        visibility:
          type: string
          enum: [private, family, public]
        sync_to_community:
          type: boolean
        community_post_id:
          type: string
          nullable: true
        happened_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    TimelineEvent:
      type: object
      properties:
        event_id:
          type: string
          example: "91001"
        pet_id:
          type: string
          example: "10001"
        event_type:
          type: string
          enum: [health, daily_log, service]
        source_type:
          type: string
          enum: [health_record, daily_log, service_appointment]
        source_id:
          type: string
          example: "70001"
        event_time:
          type: string
          format: date-time
        title:
          type: string
        summary:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [private, family, public]
        created_at:
          type: string
          format: date-time

    AdminPetContext:
      type: object
      properties:
        pet_id:
          type: string
          example: "10001"
        pet_name:
          type: string
          example: "Momo"
        pet_type:
          type: string
          example: "cat"
        family_id:
          type: string
          nullable: true
        family_name:
          type: string
          nullable: true
        owner_user_id:
          type: string
          nullable: true
        owner_nickname:
          type: string
          nullable: true
        owner_mobile:
          type: string
          nullable: true

    AdminUserContext:
      type: object
      properties:
        user_id:
          type: string
          example: "20001"
        nickname:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true

    AdminUserSettings:
      type: object
      properties:
        current_pet_id:
          type: string
          nullable: true
          example: "10001"
        notification_enabled:
          type: boolean
          example: true
        privacy_level:
          type: string
          enum: [normal, private]
          example: "normal"

    AdminUserFamily:
      type: object
      properties:
        family_id:
          type: string
          example: "30001"
        family_name:
          type: string
          example: "Momo的家庭"
        role:
          type: string
          enum: [owner, admin, member]
          example: "owner"
        member_count:
          type: integer
          example: 1

    AdminUser:
      type: object
      properties:
        user_id:
          type: string
          example: "20001"
        mobile:
          type: string
          example: "13800000000"
        nickname:
          type: string
          example: "Momo"
        avatar_url:
          type: string
          nullable: true
        city_code:
          type: string
          nullable: true
          example: "330100"
        city_name:
          type: string
          nullable: true
          example: "杭州"
        status:
          type: integer
          example: 1
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/AdminUserSettings'
        primary_family:
          allOf:
            - $ref: '#/components/schemas/AdminUserFamily'
          nullable: true
        current_pet:
          allOf:
            - $ref: '#/components/schemas/AdminPetContext'
          nullable: true
        pet_count:
          type: integer
          example: 1

    AdminFamilyMember:
      type: object
      properties:
        member_id:
          type: string
          example: "41001"
        user_id:
          type: string
          example: "20001"
        nickname:
          type: string
          nullable: true
          example: "Momo"
        mobile:
          type: string
          nullable: true
          example: "13800000000"
        role:
          type: string
          enum: [owner, admin, member]
          example: "owner"
        invite_status:
          type: string
          enum: [pending, joined, rejected]
          example: "joined"
        joined_at:
          type: string
          format: date-time
          nullable: true

    AdminFamilyPet:
      type: object
      properties:
        pet_id:
          type: string
          example: "10001"
        pet_name:
          type: string
          example: "Momo"
        pet_type:
          type: string
          example: "cat"
        breed:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, memorial, rehomed]
          example: "active"
        owner_user_id:
          type: string
          nullable: true
          example: "20001"
        owner_nickname:
          type: string
          nullable: true
        owner_mobile:
          type: string
          nullable: true

    AdminFamily:
      type: object
      properties:
        family_id:
          type: string
          example: "30001"
        family_name:
          type: string
          example: "Momo的家庭"
        owner:
          $ref: '#/components/schemas/AdminUserContext'
        status:
          type: integer
          enum: [1, 2]
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        member_count:
          type: integer
          example: 2
        pet_count:
          type: integer
          example: 1
        members:
          type: array
          items:
            $ref: '#/components/schemas/AdminFamilyMember'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/AdminFamilyPet'

    AdminPetFamily:
      type: object
      properties:
        family_id:
          type: string
          example: "30001"
        family_name:
          type: string
          nullable: true
          example: "Momo的家庭"
        status:
          type: integer
          nullable: true
          enum: [1, 2]
        member_count:
          type: integer
          example: 1

    AdminPet:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        owner:
          $ref: '#/components/schemas/AdminUserContext'
        family:
          allOf:
            - $ref: '#/components/schemas/AdminPetFamily'
          nullable: true

    AdminHealthRecord:
      type: object
      properties:
        health_record:
          $ref: '#/components/schemas/HealthRecord'
        pet:
          $ref: '#/components/schemas/AdminPetContext'
        operator:
          $ref: '#/components/schemas/AdminUserContext'

    AdminDailyLog:
      type: object
      properties:
        daily_log:
          $ref: '#/components/schemas/DailyLog'
        pet:
          $ref: '#/components/schemas/AdminPetContext'
        author:
          $ref: '#/components/schemas/AdminUserContext'

    AdminTimelineEvent:
      type: object
      properties:
        timeline_event:
          $ref: '#/components/schemas/TimelineEvent'
        pet:
          $ref: '#/components/schemas/AdminPetContext'
        source_status:
          type: string
          enum: [active, deleted, missing, unsupported]
          description: 源记录状态

    AdminReminderSource:
      type: object
      properties:
        source_record_id:
          type: string
          example: "70001"
        record_type:
          type: string
          nullable: true
          enum: [vaccine, deworming, examination, medication, weight, observation]
        title:
          type: string
          nullable: true
          example: "驱虫记录"
        status:
          type: string
          enum: [active, deleted, missing]
          description: 来源健康记录状态

    AdminReminder:
      type: object
      properties:
        reminder:
          $ref: '#/components/schemas/Reminder'
        pet:
          $ref: '#/components/schemas/AdminPetContext'
        handler:
          allOf:
            - $ref: '#/components/schemas/AdminUserContext'
          nullable: true
        source_record:
          allOf:
            - $ref: '#/components/schemas/AdminReminderSource'
          nullable: true

security:
  - BearerAuth: []

paths:
  # ==================== 认证模块 ====================
  /auth/sms/send:
    post:
      tags:
        - 认证 (Auth)
      summary: 发送短信验证码
      description: |
        发送短信验证码用于登录
        
        **校验规则**:
        - mobile 格式校验
        - 图形验证通过
        - 发送频率限制
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobile
                - scene
              properties:
                mobile:
                  type: string
                  example: "13800000000"
                  description: 手机号
                scene:
                  type: string
                  example: "login"
                  enum: [login]
                  description: 场景类型
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent:
                            type: boolean
                            example: true
                          expire_seconds:
                            type: integer
                            example: 300
                            description: 验证码有效期（秒）
                            
  /auth/login/sms:
    post:
      tags:
        - 认证 (Auth)
      summary: 短信登录
      description: |
        使用手机号和验证码登录
        
        **返回关键字段**:
        - access_token
        - refresh_token
        - user (用户信息)
        - family_summary (家庭摘要)
        - pets (宠物列表)
        - current_pet_id (当前宠物)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mobile
                - code
              properties:
                mobile:
                  type: string
                  example: "13800000000"
                  description: 手机号
                code:
                  type: string
                  example: "123456"
                  description: 验证码
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                            description: 访问令牌
                          refresh_token:
                            type: string
                            description: 刷新令牌
                          user:
                            type: object
                            description: 用户信息
                          family_summary:
                            type: object
                            description: 家庭摘要
                          pets:
                            type: array
                            description: 宠物列表
                            items:
                              type: object
                          current_pet_id:
                            type: string
                            nullable: true
                            description: 当前宠物 ID
                            
  /auth/refresh:
    post:
      tags:
        - 认证 (Auth)
      summary: 刷新 Token
      description: |
        使用 refresh_token 刷新 access_token
        
        **说明**:
        - 成功后返回新的 access_token 和 refresh_token
        - 刷新时会吊销旧会话并轮换新会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
