          required: true
          schema:
            type: integer
            format: int64
          description: 日常记录 ID
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DailyLog'
          
    patch:
      tags:
        - 日常 (Daily Log)
      summary: 更新萌宠日常
      description: 更新日常记录
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: dailyLogId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 日常记录 ID
      requestBody:
        required: true
