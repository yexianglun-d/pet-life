  # ==================== 提醒模块 ====================
  /pets/{petId}/reminders:
    get:
      tags:
        - 提醒 (Reminder)
      summary: 获取提醒列表
      description: |
        获取宠物的提醒列表
        
        **状态筛选**:
        - pending: 待处理
        - done: 已完成
        - skipped: 已跳过
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, done, skipped]
          description: 状态筛选
      responses:
        '200':
          description: 获取成功
          
    post:
      tags:
        - 提醒 (Reminder)
      summary: 创建提醒
      description: |
        创建新提醒
        
        **说明**:
        - reminder_mode=single 表示单次提醒，可不传 cycle_value 和 cycle_unit
        - reminder_mode=cycle 表示周期提醒，必须同时传 cycle_value 与 cycle_unit
        - cycle_unit 当前支持 day、week、month
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reminder_type
                - title
                - reminder_mode
                - due_at
              properties:
                reminder_type:
                  type: string
                  example: "vaccine"
                  enum: [vaccine, deworming, examination, medication, custom]
                  description: 提醒类型
                title:
                  type: string
                  example: "狂犬疫苗提醒"
                  description: 提醒标题
                reminder_mode:
                  type: string
                  example: "single"
                  enum: [single, cycle]
                  description: 提醒模式
                cycle_value:
                  type: integer
                  example: 1
                  description: 周期间隔值
                cycle_unit:
                  type: string
                  example: "month"
                  enum: [day, week, month]
                  description: 周期单位
                due_at:
                  type: string
                  format: date-time
                  example: "2026-05-20T10:00:00Z"
                  description: 提醒时间
                notes:
                  type: string
                  example: "记得提前预约"
                  description: 备注
      responses:
        '200':
          description: 创建成功
          
  /pets/{petId}/reminders/{reminderId}/complete:
    patch:
      tags:
        - 提醒 (Reminder)
      summary: 完成提醒
      description: |
        标记提醒为已完成
        
        **说明**:
        - 仅 pending 状态的提醒允许完成
        - 周期提醒完成后会自动生成下一条 pending 提醒，下一次时间基于原计划时间顺延推算
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: reminderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 提醒 ID
      responses:
        '200':
          description: 完成成功
          
  /pets/{petId}/reminders/{reminderId}/skip:
    patch:
      tags:
        - 提醒 (Reminder)
      summary: 跳过提醒
      description: |
        跳过提醒
        
        **说明**:
        - 仅 pending 状态的提醒允许跳过
        - 周期提醒跳过后同样会自动生成下一条 pending 提醒
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: reminderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 提醒 ID
      responses:
        '200':
          description: 跳过成功
          
  # ==================== 萌宠日常模块 ====================
  /pets/{petId}/daily-logs:
    get:
      tags:
        - 日常 (Daily Log)
      summary: 获取萌宠日常列表
      description: 获取宠物的日常记录列表
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DailyLog'
          
    post:
      tags:
        - 日常 (Daily Log)
      summary: 创建萌宠日常
      description: |
        创建新的日常记录
        
        **说明**:
        - sync_to_community 仅在 visibility=public 时允许开启
        - 打开同步后会生成或更新对应社区帖子
        - 关闭同步或改为非公开时会自动撤回社区帖子
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
                - visibility
                - happened_at
              properties:
                content:
                  type: string
                  example: "今天第一次散步，出门有点紧张，但表现很好"
                  description: 日常内容
                tags:
                  type: array
                  items:
                    type: string
                  example: ["散步", "成长"]
                  description: 标签
                media_asset_ids:
                  type: array
                  items:
                    type: string
                  example: ["90001"]
                  description: 媒体资源 ID 列表，必须引用当前用户已上传完成且 biz_type=daily_log 的图片或视频
                visibility:
                  type: string
                  example: "family"
                  enum: [private, family, public]
                  description: 可见范围
                sync_to_community:
                  type: boolean
                  example: false
                  description: 是否同步到社区
                happened_at:
                  type: string
                  format: date-time
                  example: "2026-04-20T09:00:00Z"
                  description: 发生时间
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DailyLog'
          
  /pets/{petId}/daily-logs/{dailyLogId}:
    get:
      tags:
        - 日常 (Daily Log)
      summary: 获取萌宠日常详情
      description: 获取指定日常记录的详细信息
      parameters:
        - name: petId
          in: path
