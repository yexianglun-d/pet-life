  # ==================== 管理端 - 审核模块 ====================
  /admin/moderation/reports:
    get:
      tags:
        - 审核 (Moderation)
      summary: 获取举报列表
      description: |
        获取举报记录列表（管理端）
        
        **状态筛选**:
        - pending: 待处理
        - processed: 已处理（确认违规）
        - rejected: 已驳回
        - all: 全部
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processed, rejected, all]
          description: 状态筛选
      responses:
        '200':
          description: 获取成功
          
  /admin/moderation/reports/{reportId}:
    patch:
      tags:
        - 审核 (Moderation)
      summary: 处理举报
      description: |
        处理举报记录（管理端）
        
        **操作类型**:
        - confirm_violation: 举报记为 processed，目标帖子审核状态改为 rejected
        - dismiss_report: 举报记为 rejected，目标帖子保持当前状态
        
        **说明**:
        - 当前阶段处理人通过请求头 X-Admin-Operator 回写，用于后台操作审计标识
        - admin_notes 会持久化并随举报响应回显
        - 处理动作会写入 moderation_report 目标类型的审计日志
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 举报 ID
        - name: X-Admin-Operator
          in: header
          required: false
          schema:
            type: string
          description: 操作人标识
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  example: "confirm_violation"
                  enum: [confirm_violation, dismiss_report]
                  description: 处理动作
                admin_notes:
                  type: string
                  example: "确认为垃圾广告"
                  description: 管理员备注
      responses:
        '200':
          description: 处理成功

  /admin/moderation/audit-logs:
    get:
      tags:
        - 审核 (Moderation)
      summary: 获取审核审计日志
      description: 获取举报处理相关审计日志，当前目标类型固定支持 moderation_report。
      parameters:
        - name: operator_id
          in: query
          required: false
          schema:
            type: string
          description: 操作人标识
        - name: target_type
          in: query
          required: false
          schema:
            type: string
            enum: [moderation_report]
          description: 审计目标类型
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [moderation_report_confirm_violation, moderation_report_dismiss_report]
          description: 审计动作
      responses:
        '200':
          description: 获取成功
          
