  /community/posts/{postId}/report:
    post:
      tags:
        - 社区 (Community)
      summary: 举报帖子
      description: |
        举报不当内容
        
        **说明**:
        - 当前阶段支持的 reason_code：spam、pornography、harassment、illegal、other
        - 当 reason_code=other 时，reason_detail 必填
        - 同一用户对同一帖子存在 pending 举报时，接口返回已有举报，不重复创建新记录
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 帖子 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason_code
              properties:
                reason_code:
                  type: string
                  example: "spam"
                  enum: [spam, pornography, harassment, illegal, other]
                  description: 举报原因代码
                reason_detail:
                  type: string
                  example: "连续出现重复引流内容"
                  description: 举报详情（reason_code=other 时必填）
      responses:
        '200':
          description: 举报成功
          
  # ==================== 服务中心模块 ====================
  /services/home:
    get:
      tags:
        - 服务 (Service)
      summary: 服务首页聚合
      description: |
        获取服务首页聚合信息
        
        **返回内容**:
        - city_code, city_name
        - opened (是否开通)
        - unavailable_reason (未开通原因)
        - categories (服务分类)
        - featured_providers (推荐服务商)
        - upcoming_appointments (即将到来的预约)
        - commerce_placeholder (商城占位)
        
        **说明**:
        - commerce_placeholder 只承接商城当前预留说明，不进入交易后端链路
        - 当前城市没有在线服务商时，接口返回未开通态，而不是空数组空白页
      parameters:
        - name: pet_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: city_code
          in: query
          required: false
          schema:
            type: string
          description: 城市编码
      responses:
        '200':
          description: 获取成功
          
  /providers:
    get:
      tags:
        - 服务 (Service)
      summary: 获取服务商列表
      description: |
        获取服务商列表
        
        **说明**:
        - provider_type 支持 hospital、boarding、grooming、training
        - 响应会返回服务项目和近期可预约时段摘要
      parameters:
        - name: provider_type
          in: query
          required: false
          schema:
            type: string
            enum: [hospital, boarding, grooming, training]
          description: 服务商类型
        - name: city_code
          in: query
          required: false
          schema:
            type: string
          description: 城市编码
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [distance, rating]
          description: 排序方式
      responses:
        '200':
          description: 获取成功
          
  /providers/{providerId}:
    get:
      tags:
        - 服务 (Service)
      summary: 获取服务商详情
      description: 获取服务商详细信息
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 服务商 ID
      responses:
        '200':
          description: 获取成功
          
  /providers/{providerId}/slots:
    get:
      tags:
        - 服务 (Service)
      summary: 获取服务商可预约时段
      description: |
        获取服务商的可预约时段
        
        **说明**:
        - 时段名额由服务端读取 provider_schedule_slots
        - available_quota = quota - booked_count
        - 只有 status=open 且剩余名额大于 0 时 bookable=true
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 服务商 ID
        - name: appointment_type
          in: query
          required: false
          schema:
            type: string
            enum: [hospital, boarding, grooming, training]
          description: 预约类型
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 开始日期
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 结束日期
      responses:
        '200':
          description: 获取成功
          
  /appointments:
    get:
      tags:
        - 服务 (Service)
      summary: 获取预约记录
      description: |
        获取用户的预约记录
        
        **状态筛选**:
        - all: 全部
        - pending_confirm: 待确认
        - confirmed: 已确认
        - completed: 已完成
        - canceled: 已取消
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, pending_confirm, confirmed, completed, canceled]
          description: 状态筛选
      responses:
        '200':
          description: 获取成功
          
    post:
      tags:
        - 服务 (Service)
      summary: 创建预约
      description: |
        创建服务预约
        
        **说明**:
        - 创建预约会校验当前用户是否有该宠物访问权
        - 创建预约会校验服务商状态、预约类型和时段名额
        - 同一时段通过数据库行锁和名额递增防止超卖
        - 预约创建后会生成站内预约通知，并派生宠物时间轴 service 事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pet_id
                - provider_id
                - appointment_type
                - appointment_date
                - appointment_slot
                - contact_name
                - contact_mobile
              properties:
                pet_id:
                  type: string
                  example: "10001"
                  description: 宠物 ID
                provider_id:
                  type: string
                  example: "70001"
                  description: 服务商 ID
                appointment_type:
                  type: string
                  example: "hospital"
                  enum: [hospital, boarding, grooming, training]
                  description: 预约类型
                appointment_date:
                  type: string
                  format: date
                  example: "2026-04-22"
                  description: 预约日期
                appointment_slot:
                  type: string
                  example: "10:00-11:00"
                  description: 预约时段
                demand_desc:
                  type: string
                  example: "最近轻微拉稀，想检查"
                  description: 需求描述
                contact_name:
                  type: string
                  example: "李明"
                  description: 联系人姓名
                contact_mobile:
                  type: string
                  example: "13800000000"
                  description: 联系电话
      responses:
        '200':
          description: 创建成功
          
  /appointments/{appointmentId}/cancel:
    patch:
      tags:
        - 服务 (Service)
      summary: 取消预约
      description: |
        取消预约
        
        **说明**:
        - 仅 pending_confirm 和 confirmed 状态允许取消
        - 取消后会回补原时段名额，并更新时间轴事件为取消态
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 预约 ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_reason:
                  type: string
                  example: "临时改期"
                  description: 取消原因
      responses:
        '200':
          description: 取消成功

          
  # ==================== 通知模块 ====================
  /notifications:
    get:
      tags:
        - 通知 (Notification)
      summary: 消息通知列表
      description: |
        获取消息通知列表
        
        **返回字段**:
        - items: 通知列表
        - unread_count: 未读总数
        - system_unread_count: 系统消息未读数
        - reminder_unread_count: 提醒消息未读数
        
        **当前已接入的通知来源**:
        - 首次登录欢迎消息：notify_type=system，biz_type=user_welcome
        - 提醒完成/跳过：notify_type=reminder，biz_type=reminder_completed|reminder_skipped
        - 审核结果：notify_type=system，biz_type=moderation_report
        
        **说明**:
        - 通知生成尊重用户 notification_switch
        - 提醒通知会按宠物访问范围投递给有权限的家庭成员
        - 当前未接入系统推送通道，接口表示站内消息中心
      parameters:
        - name: notify_type
          in: query
          required: false
          schema:
            type: string
            enum: [all, system, reminder]
          description: 通知类型筛选
        - name: read_status
          in: query
          required: false
          schema:
            type: string
            enum: [all, unread, read]
          description: 阅读状态筛选
      responses:
        '200':
          description: 获取成功
          
  /notifications/{notificationId}/read:
    patch:
      tags:
        - 通知 (Notification)
      summary: 单条已读
      description: 标记单条通知为已读
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 通知 ID
      responses:
        '200':
          description: 标记成功
          
  /notifications/read:
    patch:
      tags:
        - 通知 (Notification)
      summary: 批量已读
      description: |
        批量标记通知为已读
        
        **说明**:
        - notify_type=all 表示全部已读
        - 也可传 system 或 reminder 按类型批量已读
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_type:
                  type: string
                  example: "all"
                  enum: [all, system, reminder]
                  description: 通知类型
      responses:
        '200':
          description: 标记成功
          
  # ==================== 首页模块 ====================
  /home/reports/weekly:
    get:
      tags:
        - 首页 (Home)
      summary: 首页周报
      description: |
        获取首页周报数据
        
        **返回关键字段**:
        - report_type
        - pet (宠物信息)
        - window_start, window_end (统计窗口)
        - pending_reminder_count (待处理提醒数)
        - completed_reminder_count (已完成提醒数)
        - skipped_reminder_count (已跳过提醒数)
        - health_record_count (健康记录数)
        - daily_log_count (日常记录数)
        - community_sync_count (社区同步数)
        - feed_count (喂食次数)
        - water_count (饮水次数)
        - toilet_count (如厕次数)
        - weight_record_count (体重记录数)
        - medication_record_count (用药记录数)
        - highlights (亮点摘要)
        - recent_reminders (最近提醒)
        - recent_health_records (最近健康记录)
        - recent_daily_logs (最近日常)
        
        **说明**:
        - 统计窗口为"最近 7 天滚动窗口"
        - 周报以当前用户 current_pet_id 对应宠物为唯一主轴
        - 快捷记录相关计数来自既有健康记录类型与萌宠日常标签，不创建新事实表
      responses:
        '200':
          description: 获取成功
          
  /home/reports/monthly:
    get:
      tags:
        - 首页 (Home)
      summary: 首页月报
      description: |
        获取首页月报数据
        
        **说明**:
        - 响应结构与周报一致
        - 统计窗口为"最近 30 天滚动窗口"
      responses:
        '200':
          description: 获取成功

