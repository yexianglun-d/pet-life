          required: true
          schema:
            type: integer
            format: int64
          description: 健康记录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 记录标题
                notes:
                  type: string
                  description: 备注
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthRecord'
          
    delete:
      tags:
        - 健康 (Health)
      summary: 删除健康记录
      description: 删除健康记录
      parameters:
        - name: petId
