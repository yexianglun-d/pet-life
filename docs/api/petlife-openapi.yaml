          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: dailyLogId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 日常记录 ID
      responses:
        '200':
          description: 删除成功

          
  # ==================== 成长时间轴模块 ====================
