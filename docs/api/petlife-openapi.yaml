  # ==================== 健康记录模块 ====================
  /pets/{petId}/health-records:
    get:
      tags:
        - 健康 (Health)
      summary: 获取健康记录列表
      description: |
        获取宠物的健康记录列表
        
        **记录类型**:
        - vaccine: 疫苗
        - deworming: 驱虫
        - examination: 体检
        - medication: 用药
        - weight: 体重
        - observation: 异常观察
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
        - name: record_type
          in: query
          required: false
          schema:
            type: string
            enum: [vaccine, deworming, examination, medication, weight, observation]
          description: 记录类型筛选
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HealthRecord'
          
    post:
      tags:
        - 健康 (Health)
      summary: 创建健康记录
      description: |
        创建新的健康记录
        
        **说明**:
        - 只有 vaccine、deworming、examination 支持通过 next_reminder_at 自动派生下一次提醒
        - 自动派生提醒以 source_record_id 关联源健康记录
        - 更新健康记录时会删除未处理的旧派生提醒并按最新表单重建
        - 删除健康记录时会同步删除仍未处理的派生提醒
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 宠物 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - record_type
                - title
                - occurred_at
              properties:
                record_type:
                  type: string
                  example: "vaccine"
                  enum: [vaccine, deworming, examination, medication, weight, observation]
                  description: 记录类型
                title:
                  type: string
                  example: "狂犬疫苗"
                  description: 记录标题
                occurred_at:
                  type: string
                  format: date-time
                  example: "2026-04-20T10:30:00Z"
                  description: 发生时间
                hospital_name:
                  type: string
                  example: "某宠物医院"
                  description: 医院名称
                doctor_name:
                  type: string
                  example: "张医生"
                  description: 医生名称
                severity_level:
                  type: string
                  enum: [normal, warning, severe]
                  description: 严重程度（用于异常观察）
                result_summary:
                  type: string
                  example: "接种完成"
                  description: 结果摘要
                notes:
                  type: string
                  example: "无异常"
                  description: 备注
                attachment_asset_ids:
                  type: array
                  items:
                    type: string
                  example: ["90001"]
                  description: 附件资源 ID 列表，必须引用当前用户已上传完成且 biz_type=health_report 的图片或 PDF
                next_reminder_at:
                  type: string
                  format: date-time
                  example: "2027-04-20T10:30:00Z"
                  description: 下次提醒时间
                next_reminder_title:
                  type: string
                  example: "下次狂犬疫苗"
                  description: 下次提醒标题
                value:
                  type: string
                  example: "4.5"
                  description: 数值（用于体重、用药剂量等）
                unit:
                  type: string
                  example: "kg"
                  description: 单位
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthRecord'
          
  /pets/{petId}/health-records/{healthRecordId}:
    get:
      tags:
        - 健康 (Health)
      summary: 获取健康记录详情
      description: 获取指定健康记录的详细信息
      parameters:
        - name: petId
          in: path
          required: true
